<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxel Island — Creative 3D Benchmark Runtime</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui {
    position: absolute; top: 12px; left: 12px; right: 12px; bottom: 12px;
    pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
  }
  #hud {
    background: rgba(0, 0, 0, 0.45); color: #e0e0e0; padding: 12px 16px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15); pointer-events: auto; max-width: 420px;
  }
  #hud h1 { margin: 0 0 6px 0; font-size: 16px; letter-spacing: 1px; color: #7dd3fc; }
  #hud p { margin: 0 0 4px 0; font-size: 12px; line-height: 1.4; opacity: 0.9; }
  #hud .ok { color: #4ade80; }
  #hud .bad { color: #f87171; }
  #controls {
    pointer-events: auto; display: flex; gap: 8px; justify-content: flex-end;
  }
  button {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff;
    padding: 8px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; backdrop-filter: blur(4px);
  }
  button:hover { background: rgba(255,255,255,0.3); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #loader {
    position: absolute; inset: 0; background: rgba(0,0,0,0.85); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 14px; pointer-events: none; transition: opacity 0.4s;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  .spinner { width: 32px; height: 32px; border: 3px solid rgba(125,211,252,0.3); border-top-color: #7dd3fc; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
  <div id="hud">
    <h1 id="title">Voxel Island</h1>
    <p id="status">Loading scene…</p>
    <p id="details">Generating procedural geometry…</p>
  </div>
  <div id="controls"></div>
</div>
<div id="loader"><div class="spinner"></div><div>Compiling scene…</div></div>

<script type="importmap">
{
  "imports": {
    "three": "vendor/three.module.js",
    "three/addons/": "vendor/jsm/"
  }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('canvas');
const statusEl = document.getElementById('status');
const detailsEl = document.getElementById('details');
const loader = document.getElementById('loader');
const controlsDiv = document.getElementById('controls');

// --- Runtime setup ---
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x87ceeb, 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 2000);
camera.position.set(40, 30, 40);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x87ceeb, 20, 160);

// Lighting
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(40, 60, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 300;
sun.shadow.camera.left = -80;
sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80;
sun.shadow.camera.bottom = -80;
scene.add(sun);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 8;
controls.maxDistance = 300;
controls.maxPolarAngle = Math.PI / 2 - 0.05;

// Deterministic seeded RNG for the model
function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
    t = (t + Math.imul(t ^ (t >>> 7), t | 61)) | 0;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20261107);
const random = () => rng();

// --- Model scene API ---
let modelScene = null;
let modelError = null;

try {
  // The model exports exactly this:
  // export function createScene({ THREE, random }) { ... return new THREE.Group(); }
  import('./scene.js').then(mod => {
    if (typeof mod.createScene !== 'function') {
      throw new Error('createScene export not found');
    }
    modelScene = mod.createScene({ THREE, random });
    if (!(modelScene instanceof THREE.Group)) {
      throw new Error('createScene must return a THREE.Group');
    }
    scene.add(modelScene);
    statusEl.textContent = 'Scene compiled OK';
    statusEl.className = 'ok';
    detailsEl.textContent = 'Model generated a valid THREE.Group. Scene is live.';
    loader.classList.add('hidden');
    initControls();
  }).catch(err => {
    modelError = err;
    statusEl.textContent = 'Scene failed';
    statusEl.className = 'bad';
    detailsEl.textContent = err.message;
    loader.classList.add('hidden');
    initControls();
  });
} catch (err) {
  modelError = err;
}

let started = false;
function initControls() {
  if (started) return; started = true;
  const rotateBtn = document.createElement('button');
  rotateBtn.textContent = 'Rotate camera 360°';
  rotateBtn.onclick = () => {
    let t = 0;
    const startAngle = controls.getAzimuthalAngle();
    const fn = () => {
      t += 0.015;
      if (t > 1) { controls.dispose; return; }
      controls.setAzimuthalAngle(startAngle + Math.PI * 2 * t);
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(fn);
    };
    fn();
  };
  const zoomBtn = document.createElement('button');
  zoomBtn.textContent = 'Zoom out';
  zoomBtn.onclick = () => { controls.dollyOut(1.4); controls.update(); renderer.render(scene, camera); };
  const screenshotBtn = document.createElement('button');
  screenshotBtn.textContent = 'Screenshot';
  screenshotBtn.onclick = () => {
    const link = document.createElement('a');
    link.download = `voxel_island_${Date.now()}.png`;
    link.href = renderer.domElement.toDataURL('image/png');
    link.click();
  };
  controlsDiv.appendChild(rotateBtn);
  controlsDiv.appendChild(zoomBtn);
  controlsDiv.appendChild(screenshotBtn);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
